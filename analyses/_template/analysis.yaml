# Copy this directory to analyses/<your-analysis-id>/ and fill it in. Directories
# starting with "_" are ignored by the library. Validate with:  pixi run -e infer pytest tests/test_registry.py
id: your-analysis-id           # must equal the directory name: lowercase letters, digits, hyphens
title: Search for ... (Experiment, dataset)
short: One sentence shown on the library cards.
experiment: ATLAS              # ATLAS | CMS | LHCb | ATLAS-like (Delphes) | other
status: draft                  # draft | example | preserved
version: "0.1"
updated: 2026-01-01
contact: Name <email>
tags: [long-lived particles, displaced jets]
references:
  - {label: "arXiv:XXXX.XXXXX", url: "https://arxiv.org/abs/XXXX.XXXXX"}
  - {label: "HEPData record", url: "https://www.hepdata.net/record/..."}
signal_region: >-
  What the returned efficiency refers to: the selection, the region, the
  observable. If the surrogate also predicts a yield, say for which
  luminosity and cross-section convention.
inputs:
  - HepMC2 or HepMC3 ASCII, generator level, 13 TeV pp; long-lived particles decayed by the generator.
predictor:
  type: my_bdt                 # the class registered in predictor.py next to this file
  model: model.json            # file in this directory loaded by the predictor
  config: {}                   # anything your predictor reads from analysis.record["predictor"]["config"]
requirements: [xgboost]        # Python modules predictor.py imports (checked by CI; add them to pixi.toml's infer feature)
default_max_events: 20000
max_events: 50000
training: >-
  How the surrogate was trained: samples, labels, what it was validated against.
validation: []                 # optional rows shown as a table: [{sample: "...", actual: 0.43, predicted: 0.38}]
figures: []                    # optional: [{file: closure.png, caption: "..."}] with the files in figures/
example: null                  # optional example input file in this directory, offered for download
