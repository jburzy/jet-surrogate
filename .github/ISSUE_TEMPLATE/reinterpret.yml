name: Reinterpretation request
description: Evaluate the signal-region efficiency of a new signal model from a HepMC file
title: "[reinterpret] "
labels: ["reinterpret"]
body:
  - type: markdown
    attributes:
      value: |
        Provide a **publicly downloadable URL** to a HepMC2 or HepMC3 file (`.hepmc`, `.hepmc3`, optionally `.gz`)
        of your signal model (generator-level, no detector simulation). A workflow downloads the file, runs the
        truth-level surrogate, and posts the predicted signal-region efficiency as a comment on this issue.
  - type: input
    id: analysis
    attributes:
      label: Analysis id
      description: directory name under analyses/ (see the Analyses page)
      value: emerging-jets-delphes
    validations:
      required: true
  - type: input
    id: hepmc_url
    attributes:
      label: HepMC file URL
      placeholder: https://cernbox.cern.ch/s/.../download
    validations:
      required: true
  - type: input
    id: model_label
    attributes:
      label: Model description (optional)
      placeholder: m_pid = 8 GeV, ctau = 0.3 mm, m_pi/Lambda = 0.7
  - type: input
    id: max_events
    attributes:
      label: Maximum number of events to process (optional, default 20000)
      placeholder: "20000"
