name: reinterpret
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: read
  issues: write
jobs:
  predict:
    if: contains(github.event.issue.labels.*.name, 'reinterpret')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
    timeout-minutes: 300
    steps:
      - name: parse request
        id: req
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const field = (label) => {
              const m = body.match(new RegExp(`### ${label}\\s*\\n+([^\\n]*)`));
              return m ? m[1].trim() : "";
            };
            const url = field("HepMC file URL");
            if (!url.startsWith("http")) core.setFailed("no HepMC URL in the issue");
            core.setOutput("url", url);
            const analysis = field("Analysis id") || "emerging-jets-delphes";
            if (!/^[a-z0-9-]+$/.test(analysis)) core.setFailed("invalid analysis id");
            core.setOutput("analysis", analysis);
            core.setOutput("label", field("Model description \\(optional\\)"));
            const n = field("Maximum number of events to process \\(optional, default 20000\\)");
            core.setOutput("max_events", /^\d+$/.test(n) ? n : "20000");
      - name: download
        run: |
          mkdir -p /work && cd /work
          curl -sSL --fail --max-filesize 5000000000 -o input.dat "${{ steps.req.outputs.url }}"
          if gzip -t input.dat 2>/dev/null; then gunzip -c input.dat > events.hepmc; else mv input.dat events.hepmc; fi
          head -c 300 events.hepmc; echo; ls -la events.hepmc
      - name: predict
        run: |
          source /app/activate.sh
          cd /app && jet-surrogate predict --hepmc /work/events.hepmc --analysis ${{ steps.req.outputs.analysis }} \
              --out /work/results --max-events ${{ steps.req.outputs.max_events }} | tee /work/predict.log
      - name: report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let body;
            try {
              const j = JSON.parse(fs.readFileSync("/work/results/events_hepmc.json"));
              body = `**Surrogate prediction** for ${"${{ steps.req.outputs.label }}" || "the submitted model"}\n\n` +
                `| events | truth jets | SR efficiency | threshold-0.5 variant | mean jet probability |\n|---|---|---|---|---|\n` +
                `| ${j.n_events} | ${j.n_truth_jets} | **${j.sr_efficiency.toFixed(4)} ± ${j.sr_efficiency_err.toFixed(4)}** | ` +
                `${j.sr_efficiency_threshold05.toFixed(4)} | ${j.mean_jet_probability.toFixed(4)} |\n\n` +
                `Signal region: two large-R jets with pT > 200 GeV above the tagger working point (10^3 QCD rejection). ` +
                `Analysis: \`${j.analysis}\`, model: \`${j.model}\`, code: ${context.sha.slice(0, 7)}. Per-event probabilities are attached as a workflow artifact ` +
                `([run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})).`;
            } catch (e) {
              body = `The reinterpretation workflow failed: see the [run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prediction-${{ github.event.issue.number }}
          path: /work/results/
