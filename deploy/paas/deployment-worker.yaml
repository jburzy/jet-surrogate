apiVersion: apps/v1
kind: Deployment
metadata:
  name: jet-surrogate-worker
  annotations:
    image.openshift.io/triggers: >-
      [{"from": {"kind": "ImageStreamTag", "name": "jet-surrogate:latest"}, "fieldPath": "spec.template.spec.containers[?(@.name==\"worker\")].image"}]
spec:
  replicas: 1                        # one job per worker at a time; the default project quota is 1 CPU of requests in total
  selector:
    matchLabels: {component: worker}
  template:
    metadata:
      labels: {component: worker}
    spec:
      containers:
        - name: worker
          image: jet-surrogate:latest        # ImageStreamTag (lookupPolicy local), kept current by the trigger
          args: ["worker"]
          envFrom: [{configMapRef: {name: jet-surrogate-config}}]
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "1", memory: 4Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: jet-surrogate-data}
