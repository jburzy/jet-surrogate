apiVersion: batch/v1
kind: CronJob
metadata:
  name: jet-surrogate-cleanup
spec:
  schedule: "17 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: cleanup
              image: ghcr.io/jburzy/jet-surrogate:latest
              args: ["worker", "--cleanup-only"]
              envFrom: [{configMapRef: {name: jet-surrogate-config}}]
              volumeMounts: [{name: data, mountPath: /data}]
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: jet-surrogate-data}
