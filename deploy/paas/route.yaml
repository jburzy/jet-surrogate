apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: jet-surrogate
  annotations:
    haproxy.router.openshift.io/timeout: 600s     # large uploads
    # CERN PaaS gives every route a whitelist of CERN IP ranges (project annotation
    # custom-ingress.okd.cern.ch/default-route-ip-whitelist); the project allows overriding it.
    # Empty = reachable from the Internet. Restore the CERN ranges to go back to CERN-only.
    haproxy.router.openshift.io/ip_whitelist: ""

spec:
  host: prism.web.cern.ch                # the site name registered at webservices.web.cern.ch
  to: {kind: Service, name: jet-surrogate}
  port: {targetPort: 8080}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
