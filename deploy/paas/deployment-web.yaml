apiVersion: apps/v1
kind: Deployment
metadata:
  name: jet-surrogate-web
spec:
  replicas: 1
  selector:
    matchLabels: {component: web}
  template:
    metadata:
      labels: {component: web}
    spec:
      containers:
        - name: web
          image: ghcr.io/jburzy/jet-surrogate:latest
          args: ["serve", "--port", "8080"]
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: jet-surrogate-config}}]
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: jet-surrogate-data}
