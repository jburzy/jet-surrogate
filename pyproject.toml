[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jet-surrogate"
version = "0.2.0"
description = "Truth-level surrogate for a detector-level emerging-jet transformer tagger"
requires-python = ">=3.11"

[project.scripts]
jet-surrogate = "jet_surrogate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jet_surrogate"]
